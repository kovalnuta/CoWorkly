version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: coworkly_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: coworkly_db
      POSTGRES_USER: coworkly_user
      POSTGRES_PASSWORD: coworkly_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworkly_user -d coworkly_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: