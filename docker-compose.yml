# Одно имя проекта для всех копий репозитория: контейнер и том базы общие,
# поэтому копирование проекта в другую папку не создаёт второй базы с другим паролем.
name: coworkly

services:
  postgres:
    image: postgres:16-alpine
    container_name: coworkly_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: coworkly_db
      POSTGRES_USER: coworkly_user
      POSTGRES_PASSWORD: coworkly_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # только с этого компьютера; 5433, чтобы не пересекаться с локальным PostgreSQL на 5432
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworkly_user -d coworkly_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
