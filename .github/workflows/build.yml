name: Build

on:
  push:
    branches: [ master, main, auth, unit_tests ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build CoWorkly
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for merge conflict markers
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.cs,*.xaml,*.csproj,*.json |
                   Where-Object { $_.FullName -notmatch '\\bin\\|\\obj\\|\\.git\\' }
          $found = $false
          foreach ($f in $files) {
            $content = Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
            if ($content -match '<<<<<<<|>>>>>>>') {
              Write-Host "Conflict marker found in $($f.FullName)"
              $found = $true
            }
          }
          if ($found) { exit 1 }

      - name: Check that secret files are not committed
        shell: pwsh
        run: |
          $bad = @(
            "CoWorkly/appsettings_new.json",
            "CoWorkly/coworkly.db"
          )
          $found = $false
          foreach ($path in $bad) {
            if (Test-Path $path) {
              Write-Host "Forbidden file found: $path"
              $found = $true
            }
          }
          if ($found) { exit 1 }

      - name: Restore dependencies
        run: dotnet restore CoWorkly/CoWorkly.csproj

      - name: Build project
        run: dotnet build CoWorkly/CoWorkly.csproj --configuration Release --no-restore
